<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <title>كاميرات المنزل</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="camera-grid" aria-label="بث الكاميرات">
    <article class="camera-card">
      <div class="camera-overlay">
        <div>
          <p class="camera-number">CAM 01</p>
          <h2>الكاميرا الأولى</h2>
        </div>
        <div class="camera-actions">
          <button class="reload-button" type="button" aria-label="إعادة تحميل الكاميرا الأولى">تحديث</button>
          <button class="fullscreen-button" type="button" aria-label="عرض الكاميرا الأولى بملء الشاشة">تكبير</button>
        </div>
      </div>
      <div class="player-wrap">
        <iframe src="/go2rtc/stream.html?src=camera1&mode=webrtc&background=true" title="الكاميرا الأولى" allow="autoplay; fullscreen" loading="eager"></iframe>
      </div>
    </article>

    <article class="camera-card">
      <div class="camera-overlay">
        <div>
          <p class="camera-number">CAM 02</p>
          <h2>الكاميرا الثانية</h2>
        </div>
        <div class="camera-actions">
          <button class="reload-button" type="button" aria-label="إعادة تحميل الكاميرا الثانية">تحديث</button>
          <button class="fullscreen-button" type="button" aria-label="عرض الكاميرا الثانية بملء الشاشة">تكبير</button>
        </div>
      </div>
      <div class="player-wrap">
        <iframe src="/go2rtc/stream.html?src=camera2&mode=webrtc&background=true" title="الكاميرا الثانية" allow="autoplay; fullscreen" loading="eager"></iframe>
      </div>
    </article>

    <article class="camera-card">
      <div class="camera-overlay">
        <div>
          <p class="camera-number">CAM 03</p>
          <h2>الكاميرا الثالثة</h2>
        </div>
        <div class="camera-actions">
          <button class="reload-button" type="button" aria-label="إعادة تحميل الكاميرا الثالثة">تحديث</button>
          <button class="fullscreen-button" type="button" aria-label="عرض الكاميرا الثالثة بملء الشاشة">تكبير</button>
        </div>
      </div>
      <div class="player-wrap">
        <iframe src="/go2rtc/stream.html?src=camera3&mode=webrtc&background=true" title="الكاميرا الثالثة" allow="autoplay; fullscreen" loading="eager"></iframe>
      </div>
    </article>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
