<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="a b"><title id="a">CCTV Home Viewer architecture</title><desc id="b">Cameras connect to go2rtc on a private LAN, then authenticated Nginx and Node.js serve the web dashboard, with optional Apple HomeKit.</desc><defs><linearGradient id="bgg" x2="1" y2="1"><stop stop-color="#0a1425"/><stop offset="1" stop-color="#142d42"/></linearGradient></defs><rect width="1200" height="360" rx="24" fill="url(#bgg)"/><text x="60" y="62" fill="#e8f7ff" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Built for your home network</text><text x="60" y="93" fill="#9eb9c9" font-family="Arial,sans-serif" font-size="17">Illustrative architecture · Keep all services behind your trusted network or VPN</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="54" y="139" width="221" height="151" rx="18" fill="#18324a" stroke="#4d8fa5" stroke-width="2"/><text x="165" y="191" fill="#fff" font-size="23" font-weight="bold">IP Cameras</text><text x="165" y="229" fill="#aacddd" font-size="17">RTSP / ONVIF</text><text x="165" y="256" fill="#8ce0ca" font-size="15">Private LAN</text><rect x="370" y="139" width="220" height="151" rx="18" fill="#163c43" stroke="#39cbb1" stroke-width="2"/><text x="480" y="188" fill="#fff" font-size="24" font-weight="bold">go2rtc</text><text x="480" y="225" fill="#b5eee5" font-size="16">Stream gateway</text><text x="480" y="254" fill="#b5eee5" font-size="16">WebRTC media</text><rect x="677" y="139" width="207" height="151" rx="18" fill="#203a58" stroke="#588fd1" stroke-width="2"/><text x="780" y="183" fill="#fff" font-size="21" font-weight="bold">Nginx + Node</text><text x="780" y="218" fill="#b9d4f1" font-size="16">Auth / sessions</text><text x="780" y="247" fill="#b9d4f1" font-size="16">Camera controls</text><rect x="975" y="139" width="169" height="151" rx="18" fill="#183c4a" stroke="#53b8d3" stroke-width="2"/><text x="1059" y="189" fill="#fff" font-size="23" font-weight="bold">Browser</text><text x="1059" y="222" fill="#a3dceb" font-size="16">Live viewer</text><text x="1059" y="249" fill="#a3dceb" font-size="16">Admin UI</text><path d="M285 216H360M600 216H667M894 216H965" fill="none" stroke="#4ce2c3" stroke-width="4"/><path d="m349 208 11 8-11 8m307-16 11 8-11 8m287-16 11 8-11 8" fill="none" stroke="#4ce2c3" stroke-width="4"/><text x="480" y="324" fill="#99dae8" font-size="16">Optional Apple HomeKit export through go2rtc</text></g></svg>