<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>كاميرات المنزل</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="viewer-page">
  <header class="viewer-toolbar">
    <div>
      <p class="eyebrow">بث مباشر</p>
      <h1>كاميرات المنزل</h1>
    </div>
    <nav>
      <button id="tv-mode-button" class="toolbar-button tv-mode-button" type="button" aria-pressed="false">وضع التلفزيون</button>
      <a class="toolbar-button" href="/admin">لوحة التحكم</a>
      <button class="toolbar-button logout-button" type="button">خروج</button>
    </nav>
  </header>

  <main id="camera-grid" class="camera-grid" aria-live="polite"></main>
  <section id="empty-state" class="empty-state" hidden>
    <h2>لا توجد كاميرات</h2>
    <p>أضف أول كاميرا من لوحة التحكم.</p>
    <a class="primary-button inline-button" href="/admin">فتح لوحة التحكم</a>
  </section>

  <script src="/common.js" defer></script>
  <script src="/viewer.js" defer></script>
</body>
</html>
