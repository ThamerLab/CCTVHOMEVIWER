<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>تسجيل الدخول | كاميرات المنزل</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true"></div>
    <p class="eyebrow">CCTV HOME VIEWER</p>
    <h1>تسجيل الدخول</h1>
    <p class="muted">الوصول إلى الكاميرات ولوحة التحكم محمي.</p>

    <form id="login-form" autocomplete="on">
      <label>
        اسم المستخدم
        <input name="username" type="text" maxlength="64" autocomplete="username" required autofocus>
      </label>
      <label>
        كلمة المرور
        <input name="password" type="password" maxlength="128" autocomplete="current-password" required>
      </label>
      <button class="primary-button" type="submit">دخول آمن</button>
      <p id="form-error" class="form-message error" role="alert"></p>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
