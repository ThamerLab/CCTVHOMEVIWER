<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>لوحة التحكم | كاميرات المنزل</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div>
      <p class="eyebrow">الإدارة الآمنة</p>
      <h1>لوحة التحكم</h1>
    </div>
    <nav>
      <a class="toolbar-button" href="/">عرض الكاميرات</a>
      <button class="toolbar-button logout-button" type="button">خروج</button>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">CAMERAS</p>
          <h2>الكاميرات</h2>
        </div>
        <button id="add-camera-button" class="primary-button inline-button" type="button">إضافة كاميرا</button>
      </div>
      <div id="camera-list" class="camera-list"></div>
    </section>

    <section class="panel security-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SECURITY</p>
          <h2>تغيير كلمة المرور</h2>
        </div>
      </div>
      <form id="password-form" class="compact-form">
        <label>
          كلمة المرور الحالية
          <input name="currentPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>
          كلمة المرور الجديدة
          <input name="newPassword" type="password" minlength="14" maxlength="128" autocomplete="new-password" required>
        </label>
        <label>
          تأكيد كلمة المرور
          <input name="confirmPassword" type="password" minlength="14" maxlength="128" autocomplete="new-password" required>
        </label>
        <button class="primary-button inline-button" type="submit">تحديث كلمة المرور</button>
        <p id="password-message" class="form-message" role="status"></p>
      </form>
    </section>
  </main>

  <dialog id="camera-dialog">
    <form id="camera-form" method="dialog">
      <div class="dialog-heading">
        <h2 id="camera-dialog-title">إضافة كاميرا</h2>
        <button class="icon-button" type="button" data-close-dialog aria-label="إغلاق">×</button>
      </div>
      <input name="id" type="hidden">
      <label>
        اسم الكاميرا
        <input name="name" type="text" minlength="1" maxlength="60" required placeholder="مثال: المدخل الرئيسي">
      </label>
      <label>
        رابط البث
        <input name="url" type="password" maxlength="2048" autocomplete="off" placeholder="rtsp://user:password@192.168.1.10:554/stream">
        <small>الرابط لا يظهر مرة أخرى بعد الحفظ. اتركه فارغًا عند تعديل الاسم فقط.</small>
      </label>
      <label class="checkbox-label">
        <input name="homekitEnabled" type="checkbox">
        تفعيل الظهور في Apple HomeKit
      </label>
      <small>بعد الحفظ سيظهر PIN في قائمة الكاميرات. أضف الكاميرا من تطبيق Home على نفس الشبكة.</small>
      <p id="camera-form-message" class="form-message error" role="alert"></p>
      <div class="dialog-actions">
        <button class="toolbar-button" type="button" data-close-dialog>إلغاء</button>
        <button class="primary-button inline-button" type="submit">حفظ</button>
      </div>
    </form>
  </dialog>

  <script src="/common.js" defer></script>
  <script src="/admin.js" defer></script>
</body>
</html>
