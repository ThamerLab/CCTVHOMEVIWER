services:
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
    expose:
      - "1984"
    networks:
      - cameras

  app:
    build: ./app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - go2rtc
    volumes:
      - app_data:/app/data
    expose:
      - "3000"
    networks:
      - cameras

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - go2rtc
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cameras

networks:
  cameras:
    driver: bridge

volumes:
  app_data:
